name: Android APK Build Engine

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Clean and Setup Project Structure
      run: |
        if [ -f netlimit-vpn.zip ]; then
          unzip -o netlimit-vpn.zip -d extracted_project
          INSIDE_DIR=$(find extracted_project -maxdepth 2 -name "settings.gradle*" -exec dirname {} \;)
          if [ -n "$INSIDE_DIR" ]; then
            echo "Project found inside: $INSIDE_DIR"
            cp -r $INSIDE_DIR/* . 2>/dev/null || true
            cp -r $INSIDE_DIR/.[!.]* . 2>/dev/null || true
          else
            cp -r extracted_project/* . 2>/dev/null || true
          fi
          rm -rf extracted_project
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Force Generate Proper Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 9.3.1
        chmod +x gradlew

    - name: Fix Missing Debug Keystore
      run: |
        # Ek default android debug keystore generate kar rahe hain taaki signing config fail na ho
        mkdir -p ~/.android
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        cp debug.keystore ~/.android/
        # Agar project ke andar kisi specific folder me khoj raha ho toh wahan bhi copy kar dete hain
        cp debug.keystore app/ || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Output APK
      uses: actions/upload-artifact@v4
      with:
        name: NetLimiter-APK
        path: "**/build/outputs/apk/debug/*-debug.apk"
