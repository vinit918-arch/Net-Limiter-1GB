name: Android APK Build Engine

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip netlimit-vpn.zip -d extracted_project
        INSIDE_DIR=$(find extracted_project -maxdepth 2 -name "gradlew" -exec dirname {} \;)
        if [ -n "$INSIDE_DIR" ]; then
          mv $INSIDE_DIR/* .
          mv $INSIDE_DIR/.[!.]* . 2>/dev/null || true
        else
          mv extracted_project/* . 2>/dev/null || true
        fi
        rm -rf extracted_project netlimit-vpn.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Output APK
      uses: actions/upload-artifact@v4
      with:
        name: NetLimiter-APK
        path: app/build/outputs/apk/debug/app-debug.apk

